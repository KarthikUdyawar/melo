apiVersion: 1

# Contact point provisioning is intentionally empty.
# Configure Telegram manually in Grafana UI (Alerting → Contact points)
# once TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are set in .env.staging.
#
# To provision automatically, set both env vars and uncomment below:
#
# contactPoints:
#   - orgId: 1
#     name: telegram
#     receivers:
#       - uid: telegram-receiver
#         type: telegram
#         settings:
#           bottoken: "${TELEGRAM_BOT_TOKEN}"
#           chatid: "${TELEGRAM_CHAT_ID}"
#
# policies:
#   - orgId: 1
#     receiver: telegram
