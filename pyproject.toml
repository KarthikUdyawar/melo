[project]
name = "melo"
version = "0.6.0"
description = "Personal self-hosted audio library — paste a YouTube URL, get a trimmed playable mp3."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

authors = [
    { name = "Karthik Udyawar", email = "karthikajithudyawar@gmail.com" },
]

keywords = ["audio", "youtube", "self-hosted", "fastapi", "minio"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "sqlalchemy==2.0.52",
    "psycopg2-binary==2.9.13",
    "celery==5.6.3",
    "redis==6.4.0",
    "minio==7.2.20",
    "yt-dlp==2026.8.19",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "uuid6==2025.0.1",
    "httpx==0.28.1",
    "apscheduler==3.11.3",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-exporter-otlp==1.44.0",
    "prometheus-client==0.26.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "starlette==1.6.0",
    "httpx2==2.12.0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
    "pyroscope-io==1.2.3",
]

[project.urls]
Homepage = "https://github.com/KarthikUdyawar/melo"
Repository = "https://github.com/KarthikUdyawar/melo"
Issues = "https://github.com/KarthikUdyawar/melo/issues"
Changelog = "https://github.com/KarthikUdyawar/melo/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-docker==3.2.5",
    "httpx==0.28.1",
    "factory-boy==3.3.3",
    "faker==40.38.0",
    "pre-commit==4.6.2",
    "psycopg2-binary==2.9.13",
    "coverage==7.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests", "venv"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "minio.*",
    "yt_dlp.*",
    "structlog.*",
    "pydantic_settings.*",
]
ignore_missing_imports = true
disable_error_code = ["misc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

addopts = ["-v"]

pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
relative_files = true

omit = [
    "app/core/logging.py",
    "app/workers/tasks.py",
    "app/workers/celery_app.py",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

show_missing = true
skip_covered = false
