<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar__logo">
            <span class="sidebar__logo-full">melo</span>
            <span class="sidebar__logo-icon" aria-hidden="true">M</span>
        </div>
        <nav class="sidebar__nav">
            <a href="#/" class="nav-link" data-route="/">
                <span class="nav-link__icon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor"
                        stroke-width="1.5">
                        <rect x="3" y="4" width="14" height="2.5" rx="1" fill="currentColor" stroke="none" />
                        <rect x="3" y="8.75" width="14" height="2.5" rx="1" fill="currentColor" stroke="none" />
                        <rect x="3" y="13.5" width="14" height="2.5" rx="1" fill="currentColor" stroke="none" />
                    </svg>
                </span>
                <span class="nav-link__label">Library</span>
            </a>
            <a href="#/favorites" class="nav-link" data-route="/favorites">
                <span class="nav-link__icon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor"
                        stroke-width="1.5">
                        <path d="M10 17s-7-4.35-7-9a4 4 0 0 1 7-2.65A4 4 0 0 1 17 8c0 4.65-7 9-7 9z" />
                    </svg>
                </span>
                <span class="nav-link__label">Favorites</span>
            </a>
            <a href="#/playlists" class="nav-link" data-route="/playlists">
                <span class="nav-link__icon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor"
                        stroke-width="1.5">
                        <rect x="3" y="3" width="6" height="6" rx="1" />
                        <rect x="11" y="3" width="6" height="6" rx="1" />
                        <rect x="3" y="11" width="6" height="6" rx="1" />
                        <rect x="11" y="11" width="6" height="6" rx="1" />
                    </svg>
                </span>
                <span class="nav-link__label">Playlists</span>
            </a>
        </nav>
        <button class="btn btn--accent sidebar__add btn-add-song-trigger" id="btn-add-song" aria-label="Add song">
            <span class="sidebar__add-icon" aria-hidden="true">+</span>
            <span class="sidebar__add-label">Add Song</span>
        </button>
    </aside>

    <main class="main">
        <div id="page-content"></div>
    </main>

    <div class="player-bar player-bar--empty" id="player-bar">
        <div class="player-bar__info" id="player-info-trigger" data-action="open-now-playing" role="button" tabindex="0" aria-label="Open now playing">
            <img class="player-bar__thumb" id="player-thumb" alt="" width="40" height="40" />
            <div class="player-bar__meta">
                <span class="player-bar__title" id="player-title"></span>
                <span class="player-bar__channel" id="player-channel"></span>
            </div>
        </div>

        <button class="player-btn player-ctrl-wide" id="btn-shuffle" aria-label="Shuffle" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 5h3.5L13 15h5" />
                <path d="M14.5 5H18v3.5" />
                <path d="M2 15h3.5L9 10" />
                <path d="M14.5 15H18v-3.5" />
            </svg>
        </button>

        <div class="player-bar__controls">
            <button class="player-btn player-ctrl-wide" id="btn-prev" aria-label="Previous">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M6 4h2v12H6zM16 4v12L7 10z" />
                </svg>
            </button>
            <button class="player-btn" id="btn-play-pause" aria-label="Play / Pause">
                <svg id="icon-play" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M6 4l10 6-10 6V4z" />
                </svg>
                <svg id="icon-pause" width="20" height="20" viewBox="0 0 20 20" fill="currentColor"
                    style="display:none">
                    <rect x="4" y="3" width="4" height="14" rx="1" />
                    <rect x="12" y="3" width="4" height="14" rx="1" />
                </svg>
            </button>
            <button class="player-btn player-ctrl-wide" id="btn-next" aria-label="Next">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M14 4h-2v12h2zM4 4v12l9-6z" />
                </svg>
            </button>
            <input type="range" class="player-scrubber" id="player-scrubber" min="0" max="100" value="0" step="0.1"
                aria-label="Seek" />
            <span class="player-time" id="player-time">0:00 / 0:00</span>
        </div>

        <button class="player-btn player-ctrl-wide loop-btn" id="btn-loop" aria-label="Enable loop" data-mode="off">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 3l3 3-3 3" />
                <path d="M3 11V9a3 3 0 0 1 3-3h11" />
                <path d="M6 17l-3-3 3-3" />
                <path d="M17 9v2a3 3 0 0 1-3 3H3" />
            </svg>
            <span class="loop-badge" id="loop-badge" aria-hidden="true">1</span>
        </button>

        <div class="player-volume player-ctrl-wide" id="player-volume">
            <button class="player-btn" id="btn-mute" aria-label="Mute">
                <svg id="icon-volume" width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M3 8v4h3l4 4V4L6 8H3z" />
                    <path d="M13 7a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.5" fill="none"
                        stroke-linecap="round" />
                </svg>
                <svg id="icon-muted" width="18" height="18" viewBox="0 0 20 20" fill="currentColor"
                    style="display:none">
                    <path d="M3 8v4h3l4 4V4L6 8H3z" />
                    <path d="M13 7l4 6M17 7l-4 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
            </button>
            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" value="1" step="0.01"
                aria-label="Volume" />
        </div>
    </div>

    <button class="fab-add btn-add-song-trigger" id="btn-add-song-fab" aria-label="Add song">+</button>

    <nav class="tab-bar" id="tab-bar" aria-label="Primary">
        <a href="#/" class="nav-link tab-bar__link" data-route="/">
            <span class="nav-link__icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="4" width="14" height="2.5" rx="1" fill="currentColor" stroke="none" />
                    <rect x="3" y="8.75" width="14" height="2.5" rx="1" fill="currentColor" stroke="none" />
                    <rect x="3" y="13.5" width="14" height="2.5" rx="1" fill="currentColor" stroke="none" />
                </svg>
            </span>
            <span class="nav-link__label">Library</span>
        </a>
        <a href="#/favorites" class="nav-link tab-bar__link" data-route="/favorites">
            <span class="nav-link__icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M10 17s-7-4.35-7-9a4 4 0 0 1 7-2.65A4 4 0 0 1 17 8c0 4.65-7 9-7 9z" />
                </svg>
            </span>
            <span class="nav-link__label">Favorites</span>
        </a>
        <a href="#/playlists" class="nav-link tab-bar__link" data-route="/playlists">
            <span class="nav-link__icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="6" height="6" rx="1" />
                    <rect x="11" y="3" width="6" height="6" rx="1" />
                    <rect x="3" y="11" width="6" height="6" rx="1" />
                    <rect x="11" y="11" width="6" height="6" rx="1" />
                </svg>
            </span>
            <span class="nav-link__label">Playlists</span>
        </a>
    </nav>

    <div id="now-playing-root"></div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script type="module" src="app.js"></script>
</body>

</html>
