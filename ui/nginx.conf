# HTTP: redirect everything to HTTPS.
server {
    listen 80;
    return 301 https://$host:4443$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/ssl/melo-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/melo-selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # FE7-5: static export can't pre-render unknown-at-build playlist
    # IDs. This rewrite serves the build's placeholder shell for any
    # real playlist path; the page reads the actual ID from
    # window.location.pathname client-side. See DECISIONS.md Sprint 7.
    location ~ ^/playlists/[^/]+/?$ {
        try_files $uri /playlists/_/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}